<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jira Rollup Agent — Close</title>
<style>
  :root {
    --bg: #0b0e13;
    --panel: #12161d;
    --ink: #e8edf4;
    --ink-dim: #8a97a8;
    --cyan: #3ec6e0;
    --amber: #f0a839;
    --hairline: rgba(232, 237, 244, 0.14);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --mono: "SF Mono", "Cascadia Code", Consolas, "Roboto Mono", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  body {
    font-family: var(--sans);
    color: var(--ink);
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(232, 237, 244, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232, 237, 244, 0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 50%, rgba(62, 198, 224, 0.07), transparent 60%);
    pointer-events: none;
  }

  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    padding: 0 8vw;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: clamp(12px, 1.1vw, 15px);
    letter-spacing: 0.28em;
    color: var(--cyan);
    text-transform: uppercase;
    margin-bottom: 22px;
  }

  h1 {
    font-size: clamp(30px, 4.2vw, 58px);
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.15;
    text-wrap: balance;
    max-width: 22ch;
  }

  /* Abstracted horizon line, echoing the intro card */
  .horizon {
    position: relative;
    width: 100%;
    max-width: 760px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan) 15%, var(--cyan) 85%, transparent);
    box-shadow: 0 0 18px 1px rgba(62, 198, 224, 0.55);
    margin: 48px 0 40px;
  }
  .horizon::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 9px;
    height: 9px;
    background: var(--amber);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 10px 2px rgba(240, 168, 57, 0.7);
  }

  .thanks {
    font-family: var(--mono);
    font-size: clamp(13px, 1.15vw, 16px);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 14px;
  }

  .repo {
    font-family: var(--mono);
    font-size: clamp(13px, 1.05vw, 15px);
    color: var(--cyan);
    margin-bottom: 40px;
  }

  /* Presenter data-tape strip, matching the intro card */
  .tape {
    border-top: 1px solid var(--hairline);
    padding-top: 18px;
    display: inline-block;
  }
  .tape-row { font-family: var(--mono); line-height: 1.9; }
  .tape-name {
    font-size: clamp(16px, 1.35vw, 19px);
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .tape-role {
    font-size: clamp(12px, 1vw, 14px);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--cyan);
  }
  .tape-org {
    font-size: clamp(12px, 1vw, 14px);
    letter-spacing: 0.06em;
    color: var(--ink-dim);
  }
</style>
</head>
<body>

<div class="grid"></div>
<div class="vignette"></div>

<div class="stage">
  <div class="eyebrow">The Result</div>
  <h1>Status reporting that speaks the right language &mdash; automatically.</h1>

  <div class="horizon"></div>

  <div class="thanks">Thanks for watching</div>
  <div class="repo">github.com/bblair2018/vslhq26-ai-rocketeer</div>

  <div class="tape">
    <div class="tape-row tape-name">Bill Blair</div>
    <div class="tape-row tape-role">Software Engineering Manager &middot; FinTech</div>
    <div class="tape-row tape-org">Universal Air Travel Plan &mdash; Austin, TX</div>
  </div>
</div>

</body>
</html>
